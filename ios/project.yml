name: DoodleShooter
options:
  bundleIdPrefix: com.viaaaron
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: BN3Q8AF82F
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  DoodleShooter:
    type: application
    platform: iOS
    sources:
      - path: DoodleShooter
      - path: ../src
        type: folder
        buildPhase: resources
      - path: ../vendor
        type: folder
        buildPhase: resources
      - path: ../index.html
        buildPhase: resources
      - path: ../style.css
        buildPhase: resources
      - path: ../mobile.css
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viaaaron.doodleshooter
        INFOPLIST_FILE: DoodleShooter/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DoodleShooterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DoodleShooterUITests]
    dependencies:
      - target: DoodleShooter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viaaaron.doodleshooter.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DoodleShooter:
    build:
      targets:
        DoodleShooter: all
    test:
      targets: [DoodleShooterUITests]
